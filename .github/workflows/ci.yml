name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python syntax
        run: python3 -m py_compile bin/honorfnpp tools/validate_devices.py
      - name: Device profiles
        run: python3 tools/validate_devices.py devices
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh tools/power-test.sh
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh uninstall.sh tools/power-test.sh
