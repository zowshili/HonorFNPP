name: Bug report
description: Report a problem with honorfnpp on a supported model
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: HONOR MagicBook X 14 Pro (FRI-HXX)
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Distro, kernel, desktop
      placeholder: Debian 13, 7.2.6, GNOME 48
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the output.
      render: text
    validations:
      required: true

  - type: textarea
    id: check
    attributes:
      label: honorfnpp check
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl -u honorfnpp -n 100 --no-pager`
      render: text
    validations:
      required: false
